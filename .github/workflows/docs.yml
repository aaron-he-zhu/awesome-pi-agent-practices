name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality_matrix:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install documentation tooling
        run: npm ci --ignore-scripts

      - name: Run repository checks
        run: npm run check

      - name: Run Awesome list checks
        run: npm run check:awesome

  quality:
    name: quality
    needs:
      - quality_matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Node matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.quality_matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
