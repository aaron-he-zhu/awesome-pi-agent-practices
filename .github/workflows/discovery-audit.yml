name: Discovery audit and bounded probe

on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-audit
  cancel-in-progress: false

jobs:
  validate:
    name: Validate data and preserve bounded search results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install validation tooling
        run: npm ci --ignore-scripts

      - name: Validate discovery data, taxonomy membership, and generated coverage
        run: npm run check:discovery && npm run check:coverage

      - name: Run bounded read-only discovery probe
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_SEARCH_TOKEN || github.token }}
          DISCOVERY_CODE_SEARCH_MODE: ${{ secrets.DISCOVERY_SEARCH_TOKEN && 'enabled' || 'skip-with-repository-token' }}
          DISCOVERY_AUTH_CONTEXT: ${{ secrets.DISCOVERY_SEARCH_TOKEN && 'dedicated read-only public discovery token; repository and code search enabled' || 'repository-scoped GitHub Actions token; repository search enabled and code search explicitly skipped' }}
        run: node scripts/discovery-probe.mjs --output discovery-artifacts/github-search.json

      - name: Upload discovery report for human triage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-discovery-${{ github.run_id }}
          path: discovery-artifacts/github-search.json
          if-no-files-found: error
          retention-days: 14
